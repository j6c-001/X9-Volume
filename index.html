<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Permissions-Policy" content="local-network=(self), loopback-network=(self)">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>X9 Volume</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-text">
        <h1 class="header-title" id="header-title">Luxsin-X9</h1>
        <p class="header-status">
          <span class="status-dot offline" id="status-dot" aria-hidden="true"></span>
          <span id="header-status">No device configured</span>
        </p>
      </div>
      <button type="button" class="settings-btn" id="settings-btn" aria-label="Device settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a7.035 7.035 0 0 0-1.63-.94l-.36-2.54A.484.484 0 0 0 14.5 2h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.22-1.13.53-1.63.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.41 1.04.72 1.63.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.22 1.13-.52 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <div id="knob-root"></div>
    </main>
  </div>

  <div class="config-overlay" id="config-overlay" hidden>
    <div class="config-dialog" role="dialog" aria-labelledby="config-title" aria-modal="true">
      <h2 id="config-title">Device IP</h2>
      <p class="config-hint">Enter the Luxsin X9 IP address on your local network. If this page is HTTPS, your browser will ask to allow local network access.</p>
      <form id="config-form">
        <input type="text" id="config-ip" name="ip" inputmode="decimal" autocomplete="off" placeholder="192.168.1.100" required>
        <p class="config-error" id="config-error" aria-live="polite"></p>
        <div class="config-actions">
          <button type="button" class="btn btn-ghost" id="config-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
